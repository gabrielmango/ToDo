[tool.poetry]
name = "todo-app"
version = "0.1.0"
description = "API profissional para gerenciamento de tarefas com FastAPI, SQLite, Alembic e testes"
authors = ["gabrielhmango <gabrielhmango@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.116.1"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
sqlalchemy = "^2.0.43"
databases = "^0.9.0"
aiosqlite = "^0.21.0"
alembic = "^1.16.4"
pydantic = {extras = ["dotenv"], version = "^2.11.7"}
loguru = "^0.7.3"
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"
httpx = "^0.28.1"
factory-boy = "^3.3.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
